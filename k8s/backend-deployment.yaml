apiVersion: apps/v1
kind: Deployment
metadata:
  name: bankc-backend
  namespace: bank-compliance
  labels:
    app: bankc-backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: bankc-backend
  template:
    metadata:
      labels:
        app: bankc-backend
        # Required for Azure Workload Identity webhook
        azure.workload.identity/use: "true"
    spec:
      serviceAccountName: bankc-sa
      containers:
        - name: bankc-backend
          # Image is set by the CI/CD pipeline via: kubectl set image
          # Format: <acr-name>.azurecr.io/bank-compliance/backend:<git-sha>
          image: PLACEHOLDER_SET_BY_CICD
          ports:
            - containerPort: 8000
          envFrom:
            - configMapRef:
                name: bankc-backend-config
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8000
            initialDelaySeconds: 20
            periodSeconds: 20
            failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: bankc-backend
  namespace: bank-compliance
spec:
  selector:
    app: bankc-backend
  ports:
    - port: 8000
      targetPort: 8000
  type: ClusterIP
