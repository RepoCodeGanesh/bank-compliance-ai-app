apiVersion: apps/v1
kind: Deployment
metadata:
  name: litellm-proxy
  namespace: bank-compliance
spec:
  replicas: 1
  selector:
    matchLabels:
      app: litellm-proxy
  template:
    metadata:
      labels:
        app: litellm-proxy
    spec:
      serviceAccountName: bankc-sa
      containers:
        - name: litellm
          # Pin to a specific release — never use :main-latest in production
          image: ghcr.io/berriai/litellm:main-v1.72.0
          args: ["--config", "/etc/litellm/config.yaml", "--port", "4000"]
          env:
            - name: AZURE_OPENAI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: litellm-secrets
                  key: AZURE_OPENAI_API_KEY
          volumeMounts:
            - name: litellm-config
              mountPath: /etc/litellm
          resources:
            requests:
              cpu: "150m"
              memory: "200Mi"
            limits:
              cpu: "500m"
              memory: "300Mi"
          ports:
            - containerPort: 4000
          readinessProbe:
            httpGet:
              path: /health
              port: 4000
            initialDelaySeconds: 15
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: 4000
            initialDelaySeconds: 30
            periodSeconds: 20
            failureThreshold: 3
      volumes:
        - name: litellm-config
          configMap:
            name: litellm-config
---
apiVersion: v1
kind: Service
metadata:
  name: litellm
  namespace: bank-compliance
spec:
  selector:
    app: litellm-proxy
  ports:
    - port: 4000
      targetPort: 4000
