model_list:
  - model_name: gpt-5.4-nano
    litellm_params:
      model: azure/gpt-5.4-nano
      api_base: https://oai-ht-taxb-p-eus-01.openai.azure.com/
      api_version: "2026-03-17"
      # Injected from litellm-secrets Kubernetes Secret via AZURE_OPENAI_API_KEY env var
      # Use "os.environ/VAR_NAME" — LiteLLM's convention for reading env vars at startup
      api_key: "os.environ/AZURE_OPENAI_API_KEY"

general_settings:
  enable_prompt_caching: true
  cache_type: "in-memory"
  cache_ttl: 7200

router_settings:
  routing_strategy: "latency-based-routing"
  num_retries: 3
  timeout: 30
