# ==============================================================================
# Enterprise BankCompliance AI — True Level 3 Golden Path Caller
# Central Org Standard: RepoCodeGanesh/.github
# ==============================================================================

name: App - BankCompliance AI CI/CD

on:
  push:
    branches: [main, develop, 'release/*', 'feature/*']
  pull_request:
    branches: [main, develop]
  workflow_dispatch:
    inputs:
      target:
        description: 'Deployment Scope Target'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - backend-only
          - frontend-only
          - quality-gate-only

permissions:
  id-token: write
  contents: write
  packages: write
  security-events: write
  actions: read

concurrency:
  group: bankc-app-${{ github.ref }}
  cancel-in-progress: false

jobs:
  golden-path-release:
    name: 🚀 Production AI Delivery
    uses: RepoCodeGanesh/.github/.github/workflows/reusable-ai-workload-pipeline.yml@main
    with:
      app_name: 'bank-compliance'
      working_directory: '.'
      cluster_name: 'aks-ht-bankc-p-cin-01'
      resource_group: 'rg-ht-bankc-p-cin-01'
      subscription_id: 'f4ffefe1-d689-4059-969c-ccc73e2a11d4'
      environment_name: 'bank-compliance-prod'
      static_web_app_name: 'stapp-ht-bankc-p-cin-01'
      swa_token_secret_name: 'bankc-swa-deployment-token'
      apim_api_id: 'bankc-compliance-api'
      apim_path: 'bankc'
      apim_spec_url: 'http://bankc-api-ht-cin.centralindia.cloudapp.azure.com/openapi.json'
      live_url: 'https://bank.mytaxbot.site'
      apim_gateway_url: 'https://apim-ht-ss-p-cin-01.azure-api.net/bankc/healthz'
      target: ${{ inputs.target || 'all' }}
    secrets:
      SHARED_CLIENT_ID: ${{ secrets.SHARED_CLIENT_ID || secrets.APP_CLIENT_ID }}
      APP_CLIENT_ID: ${{ secrets.APP_CLIENT_ID }}
      AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
