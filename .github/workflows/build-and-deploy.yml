name: Build & Deploy BankCompliance AI

on:
  push:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  id-token: write
  contents: read
  packages: write

env:
  ACR_NAME: acrhtbankcpcin01             # Update with your actual ACR name
  IMAGE_NAME: bank-compliance/backend
  AKS_CLUSTER: aks-ht-bankc-p-cin-01
  AKS_RG: rg-ht-bankc-p-cin-01
  K8S_NAMESPACE: bank-compliance

jobs:
  build-backend:
    name: Build & Push Backend Image
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ steps.meta.outputs.image_tag }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Azure OIDC Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.APP_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Set Image Tag
        id: meta
        run: echo "image_tag=${{ env.ACR_NAME }}.azurecr.io/${{ env.IMAGE_NAME }}:${{ github.sha }}" >> $GITHUB_OUTPUT

      - name: Login to ACR
        run: az acr login --name ${{ env.ACR_NAME }}

      - name: Build & Push Backend Docker Image
        run: |
          docker build -t ${{ steps.meta.outputs.image_tag }} ./backend
          docker push ${{ steps.meta.outputs.image_tag }}

  deploy-backend:
    name: Deploy Backend to AKS
    runs-on: ubuntu-latest
    needs: build-backend
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Azure OIDC Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.APP_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Set AKS Context
        uses: azure/aks-set-context@v3
        with:
          resource-group: ${{ env.AKS_RG }}
          cluster-name: ${{ env.AKS_CLUSTER }}

      - name: Apply Core K8s Manifests (idempotent)
        run: |
          kubectl apply -f k8s/namespace.yaml
          kubectl apply -f k8s/serviceaccount.yaml
          kubectl apply -f k8s/backend-configmap.yaml
          kubectl apply -f k8s/litellm/secret.yaml  || true  # skip if managed by Key Vault operator
          kubectl apply -f k8s/litellm/deployment.yaml
          kubectl apply -f k8s/keda/scaledobject.yaml

      - name: Apply Backend Deployment
        run: kubectl apply -f k8s/backend-deployment.yaml

      - name: Update Backend Image
        run: |
          kubectl set image deployment/bankc-backend \
            bankc-backend=${{ needs.build-backend.outputs.image_tag }} \
            -n ${{ env.K8S_NAMESPACE }}

      - name: Wait for Rollout
        run: |
          kubectl rollout status deployment/bankc-backend \
            -n ${{ env.K8S_NAMESPACE }} --timeout=120s

  deploy-frontend:
    name: Deploy Frontend to Azure Static Web App
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Deploy Frontend to Azure Static Web App
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: "upload"
          app_location: "frontend"
          output_location: "dist"
          app_build_command: "npm run build"
          api_location: ""

